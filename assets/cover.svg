<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1f2633" stroke-width="1"/>
    </pattern>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="#0d1117"/>
  <rect width="1200" height="420" fill="url(#g)"/>

  <!-- type guides: ascender, x-height, baseline -->
  <g stroke="#3b82f6" stroke-opacity=".45" stroke-dasharray="6 6">
    <line x1="60" y1="92" x2="1140" y2="92"/>
    <line x1="60" y1="176" x2="1140" y2="176"/>
    <line x1="60" y1="300" x2="1140" y2="300"/>
  </g>
  <g fill="#3b82f6" fill-opacity=".8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
    <text x="64" y="86">ascender</text>
    <text x="64" y="170">x-height</text>
    <text x="64" y="294">baseline</text>
  </g>

  <!-- the name -->
  <text x="600" y="300" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="270" font-weight="800" letter-spacing="-8"
        fill="url(#f)" fill-opacity=".14" stroke="url(#f)" stroke-width="3">Vigi</text>

  <!-- construction points -->
  <g fill="#0d1117" stroke="#7c9cff" stroke-width="2">
    <circle cx="372" cy="92" r="5"/><circle cx="828" cy="92" r="5"/>
    <circle cx="372" cy="300" r="5"/><circle cx="828" cy="300" r="5"/>
    <circle cx="600" cy="300" r="5"/><circle cx="600" cy="92" r="5"/>
  </g>

  <text x="600" y="396" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#8b949e" letter-spacing="4">MOBILE DEVELOPER · iOS · ANDROID · KMP</text>
</svg>
